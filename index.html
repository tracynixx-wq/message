<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Чат</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="theme-color" content="#ffffff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Чат">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
:root{--bg:#fff;--fg:#14161a;--mut:#6b7280;--card:#f3f4f6;--line:#e5e7eb;--accent:#3e88f7;--bubble:#3e88f7;--in:#fff;--wall:var(--bg)}
[data-t=dark]{--bg:#000;--fg:#fff;--mut:#8e8e93;--card:#1c1c1e;--line:#2c2c2e;--in:#262628}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{font:16px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--fg);overflow:hidden;overscroll-behavior:none}
[hidden]{display:none!important}
input,textarea,button{font:inherit;color:inherit}
input,textarea{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 13px;width:100%;outline:none}
input:focus,textarea:focus{border-color:var(--accent)}
button{border:0;background:none;cursor:pointer}
.btn{background:var(--accent);color:#fff;border-radius:12px;padding:12px 16px;font-weight:600;width:100%}
.btn.sec{background:var(--card);color:var(--fg)}
section.full{position:fixed;inset:0;display:flex;flex-direction:column}
#auth,#load{align-items:center;justify-content:center;padding:24px}
.box{width:100%;max-width:340px;display:grid;gap:12px;text-align:center}
.box img{width:84px;height:84px;border-radius:22px;margin:0 auto}
.box h1{margin:4px 0 8px;font-size:28px}
#msg,#hint{color:var(--mut);font-size:14px;margin:0;min-height:18px}
#sw{color:var(--accent);font-weight:600}
.av{border-radius:50%;object-fit:cover;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;flex:none}
#head{display:flex;align-items:center;gap:12px;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;border-bottom:1px solid var(--line);background:var(--bg)}
#who{flex:1;min-width:0;text-align:left}
#who b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#who small{color:var(--mut)}
#gear{font-size:22px;padding:6px}
#htop{display:flex;align-items:center;justify-content:space-between;padding:calc(12px + env(safe-area-inset-top)) 16px 8px;font-size:24px}
.sbox{padding:4px 14px 8px}
#clist{flex:1;overflow-y:auto}
.crow{display:flex;gap:12px;align-items:center;padding:10px 14px;cursor:pointer}
.crow:active{background:var(--card)}
.ci{flex:1;min-width:0}.ci b,.ci small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ci small{color:var(--mut)}
.cm{text-align:right;font-size:12px;color:var(--mut)}
.badge{display:inline-block;background:var(--accent);color:#fff;border-radius:10px;padding:0 7px;margin-top:4px;font-size:12px}
#att,#mic{height:44px;min-width:40px;font-size:22px;flex:none}
#mic.rec{color:#dc2626;font-size:15px;font-weight:700}
.mi{max-width:100%;max-height:320px;border-radius:12px;display:block;margin-bottom:2px}
audio{width:220px;max-width:100%;height:36px;display:block}
#viewer img{max-width:100%;max-height:100%}
#back{font-size:32px;padding:0 6px;color:var(--accent);line-height:1}
.empty{text-align:center;color:var(--mut);padding:40px 24px}
#list{flex:1;overflow-y:auto;padding:10px 12px;background:var(--wall);-webkit-overflow-scrolling:touch}
.day{text-align:center;margin:10px 0;font-size:13px;color:var(--mut)}
.day::before{content:"";}
.row{display:flex;margin:3px 0}.row.me{justify-content:flex-end}
.b{max-width:80%;padding:7px 10px 5px;border-radius:16px 16px 16px 4px;background:var(--in);box-shadow:0 1px 1px rgba(0,0,0,.08);white-space:pre-wrap;word-break:break-word;position:relative}
.me .b{background:var(--bubble);color:#fff;border-radius:16px 16px 4px 16px}
.t{display:block;text-align:right;font-size:11px;opacity:.65;font-style:normal;margin-top:1px;white-space:nowrap}
.rp{border-left:3px solid var(--accent);padding:1px 7px;margin-bottom:4px;font-size:13px;opacity:.85;background:rgba(127,127,127,.15);border-radius:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me .rp{border-color:#fff}
.chips{display:flex;gap:4px;flex-wrap:wrap;margin-top:3px}
.chip{background:rgba(127,127,127,.2);border-radius:12px;padding:1px 7px;font-size:13px}
.chip.on{background:var(--accent);color:#fff}
#bar{display:flex;align-items:center;gap:8px;padding:6px 14px;background:var(--card);border-top:1px solid var(--line);font-size:14px}
#bar span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#comp{display:flex;gap:8px;align-items:flex-end;padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:var(--bg);border-top:1px solid var(--line)}
#inp{resize:none;max-height:120px;border-radius:22px;height:44px;line-height:22px;padding:10px 14px;display:block;margin:0}
#sendb{width:44px;height:44px;border-radius:50%;background:var(--accent);color:#fff;font-size:20px;flex:none}
.over{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:5}
.sh{background:var(--bg);width:100%;max-width:520px;border-radius:20px 20px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));max-height:92dvh;overflow-y:auto;display:grid;gap:10px}
.sh button.a{text-align:left;padding:12px;border-radius:10px;background:var(--card)}
.red{color:#dc2626}
.rxs{display:flex;justify-content:space-between;font-size:28px}.rxs b{padding:4px 6px;font-weight:400}
.sh h2{margin:0;font-size:20px}
.sh label{font-size:13px;color:var(--mut);display:grid;gap:4px}
.two{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.two input[type=color]{padding:2px;height:42px}
.walls{display:flex;gap:8px}.walls i{flex:1;height:54px;border-radius:12px;border:2px solid transparent;cursor:pointer}.walls i.on{border-color:var(--accent)}
.seg{display:flex;background:var(--card);border-radius:12px;padding:3px}.seg button{flex:1;padding:8px;border-radius:10px}.seg .on{background:var(--accent);color:#fff}
.pav{display:flex;align-items:center;gap:14px}
.cardh{height:110px;margin:-16px -16px 0;border-radius:20px 20px 0 0}
.big{margin-top:-46px;margin-left:4px;border:4px solid var(--bg)}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#111;color:#fff;padding:9px 14px;border-radius:20px;font-size:14px;z-index:9}

.pane{flex:1;display:flex;flex-direction:column;min-height:0}
.htop{display:flex;align-items:center;justify-content:space-between;padding:calc(12px + env(safe-area-inset-top)) 16px 8px;font-size:20px}
.sp{width:44px}.rb{width:44px;height:44px;border-radius:50%;background:var(--accent);color:#fff;font-size:20px}
.sbox input{border-radius:22px;background:var(--card);border-color:transparent}
.plist{flex:1;overflow-y:auto;padding-bottom:120px}
.crow{padding:9px 16px;position:relative}
.crow+.crow::before{content:"";position:absolute;top:0;left:88px;right:0;border-top:1px solid var(--line)}
.ci b{font-size:17px}.ci small{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:15px}
#tabs{position:absolute;left:16px;right:16px;bottom:calc(10px + env(safe-area-inset-bottom));display:flex;gap:4px;background:var(--card);border-radius:32px;padding:6px;box-shadow:0 6px 24px rgba(0,0,0,.35);border:1px solid var(--line);z-index:3}
#tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0 6px;border-radius:26px;font-size:12px;font-weight:600;color:var(--fg)}
#tabs button.on{background:var(--line);color:var(--accent)}
.sp1{text-align:center;padding:calc(18px + env(safe-area-inset-top)) 16px 4px}
.sp1 .av{margin:0 auto}.sp1 h2{margin:10px 0 2px;font-size:26px}.sp1 small{color:var(--mut);font-size:16px}
.grp{margin:16px;background:var(--card);border-radius:22px;overflow:hidden}
.srow{display:flex;align-items:center;gap:14px;padding:12px 16px;font-size:17px}
.srow+.srow{border-top:1px solid var(--line)}
.srow span{flex:1}.srow em{color:var(--mut);font-style:normal;font-size:22px}.srow .val{color:var(--mut);font-weight:400}
.srow.red span{color:#ff453a}
.ic{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:17px;flex:none}

.ph{position:relative;border-radius:26px;padding:26px 16px 18px;text-align:center;color:#fff;overflow:hidden}
.ph .e{position:absolute;opacity:.3;font-size:22px;transform:translate(-50%,-50%);pointer-events:none}
.ph .av{margin:0 auto;position:relative}.ph .nm{font-size:25px;font-weight:700;margin-top:10px;position:relative}.ph small{opacity:.8;font-size:16px;position:relative}
.mut{color:var(--mut)}
.pal{display:grid;grid-template-columns:repeat(8,1fr);gap:10px;padding:14px 14px 12px;border-bottom:1px solid var(--line)}
.pal i{aspect-ratio:1;border-radius:50%;cursor:pointer;transition:transform .15s,box-shadow .15s}
.pal i.on{box-shadow:0 0 0 3px var(--card),0 0 0 5px var(--accent);transform:scale(.88)}
.emg{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;background:var(--card);border-radius:18px;padding:10px;text-align:center}
.emg b{font-weight:400;font-size:24px;padding:6px 0;border-radius:10px;cursor:pointer}.emg b:active{background:var(--line)}
button,.crow,.pal i,.walls i,.srow{transition:transform .15s,background-color .2s,opacity .2s}
button:active{transform:scale(.95)}
.walls i,.srow[data-s]{cursor:pointer}.walls i:active{transform:scale(.92)}
body,#head,#comp,#tabs,.grp,input,textarea,.b,.sh{transition:background-color .35s,color .35s,border-color .35s}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{transform:translateY(60%);opacity:.4}to{transform:none;opacity:1}}
@keyframes slide{from{transform:translateX(26%);opacity:0}to{transform:none;opacity:1}}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.94)}to{opacity:1;transform:none}}
@keyframes zoom{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}
@keyframes tst{from{opacity:0;transform:translate(-50%,12px)}to{opacity:1;transform:translate(-50%,0)}}
.over:not([hidden]){animation:fade .22s ease-out}
.over:not([hidden]) .sh{animation:up .38s cubic-bezier(.2,.9,.25,1)}
#viewer:not([hidden]) img{animation:zoom .28s cubic-bezier(.2,.9,.25,1)}
#chat:not([hidden]){animation:slide .32s cubic-bezier(.2,.9,.25,1)}
#home:not([hidden]),#auth:not([hidden]){animation:fade .25s ease-out}
.pane:not([hidden]){animation:fade .2s ease-out}
.row.in .b{animation:pop .26s cubic-bezier(.2,.9,.25,1);transform-origin:bottom}
.row.in.me .b{transform-origin:bottom right}
#toast:not([hidden]){animation:tst .25s ease-out}
#tabs button.on{animation:fade .2s}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<section id="load" class="full"><div class="box"><img src="icon-192.png" alt=""><p>Загрузка…</p></div></section>

<section id="auth" class="full" hidden><div class="box">
<img src="icon-192.png" alt=""><h1>Чат</h1>
<input id="em" type="email" placeholder="Почта" autocomplete="email" autocapitalize="off">
<input id="pw" type="password" placeholder="Пароль, от 6 символов" autocomplete="current-password">
<button id="go" class="btn">Войти</button>
<p id="msg"></p>
<a id="sw">Создать аккаунт</a>
<p id="hint"></p>
</div></section>

<section id="home" class="full" hidden>
<div id="pChats" class="pane"><div class="htop"><span class="sp"></span><b>Чаты</b><button class="rb" id="newc" aria-label="Новый чат">✎</button></div>
<div class="sbox"><input id="q" placeholder="Поиск" autocapitalize="off"></div><div id="clist" class="plist"></div></div>
<div id="pCont" class="pane" hidden><div class="htop"><span class="sp"></span><b>Контакты</b><span class="sp"></span></div>
<div class="sbox"><input id="q2" placeholder="Поиск по имени или @юзернейму" autocapitalize="off"></div><div id="ulist" class="plist"></div></div>
<div id="pSet" class="pane" hidden><div id="sprof"></div><div id="sbody" class="plist"></div></div>
<nav id="tabs"><button data-t="Cont"><svg viewBox="0 0 24 24" width="26" height="26" fill="currentColor"><circle cx="12" cy="8" r="4.2"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7z"/></svg>Контакты</button><button data-t="Chats" class="on"><svg viewBox="0 0 24 24" width="26" height="26" fill="currentColor"><path d="M3 11a8 7 0 0 1 16 0 8 7 0 0 1-8 7 9 9 0 0 1-3-.5L4 20l1.5-3.5A7 7 0 0 1 3 11z"/></svg>Чаты</button><button data-t="Set"><svg viewBox="0 0 24 24" width="26" height="26" fill="currentColor"><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="4" stroke-dasharray="3.14 3.14"/><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="2.6"/></svg>Настройки</button></nav>
</section>

<section id="chat" class="full" hidden>
<div id="head"><button id="back" aria-label="Назад">‹</button><div id="hav"></div><div id="who"></div></div>
<div id="list"></div>
<div id="bar" hidden><span id="bt"></span><button id="bx" aria-label="Отмена">✕</button></div>
<div id="comp"><button id="att" aria-label="Фото">📎</button><input id="fileIn" type="file" accept="image/*" hidden><textarea id="inp" rows="1" placeholder="Сообщение"></textarea><button id="mic" aria-label="Голосовое">🎤</button><button id="sendb" aria-label="Отправить">➤</button></div>
</section>

<div id="sheet" class="over" hidden></div>
<div id="menu" class="over" hidden></div>
<div id="viewer" class="over" style="align-items:center" hidden></div>
<div id="toast" hidden></div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const WALLS={none:['var(--bg)','var(--bg)'],
mist:['linear-gradient(180deg,#eef2f7,#e3e9f2)','linear-gradient(180deg,#0d1118,#101826)'],
mint:['linear-gradient(180deg,#eef5f1,#e1eee6)','linear-gradient(180deg,#0b1412,#0e1f1a)'],
dusk:['linear-gradient(180deg,#f2eff7,#e8e2f2)','linear-gradient(180deg,#120e1a,#1b1429)'],
sand:['linear-gradient(180deg,#f5f2ec,#ebe6da)','linear-gradient(180deg,#15120d,#211b12)']};
const PAL=[['#4a7ec2'],['#569c3a'],['#b8763a'],['#ae5148'],['#8654c8'],['#56a1ad'],['#a84d7e'],['#7d8896'],
['#8fd3f2','#5f8dd0'],['#b5d86b','#4f9a62'],['#e8b45a','#c27a50'],['#f09a70','#c0555c'],['#df83e3','#8d62d0'],['#98e0c8','#4e95c5'],['#e891a0','#b84f82'],['#b4bcc8','#6c7685']];
const BGE=['','🔥','❤️','⭐','🌸','🌙','🐱','🎮','🎵','🍀','👻','💎','🦋','☕','🚀','🌈'];
const POS=[[8,14],[24,7],[40,10],[60,10],[76,7],[92,14],[10,42],[90,42],[7,70],[26,84],[74,84],[93,70],[18,58],[82,58]];
const pc=c=>{const a=String(c||'').split(',').map(x=>x.trim()).filter(x=>/^#[0-9a-f]{6}$/i.test(x));return a.length>1?a:[a[0]||'#4a7ec2',a[0]||'#4a7ec2']};
const grad=c=>{const [a,b]=pc(c);return `linear-gradient(135deg,${a},${b})`};
const EM=['👍','❤️','😂','😮','😢','🔥'];
let shown={},sb,me=null,prof=null,other=null,msgs=[],reply=null,editing=null,pend=null,authMode='in',booted=false;

function toast(t){const e=$('#toast');e.textContent=t;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>e.hidden=true,2600)}
function theme(o){const t={mode:'auto',accent:'#3e88f7',bubble:'#3e88f7',wall:'none',...(o||{})};
 const dark=t.mode==='dark'||(t.mode==='auto'&&matchMedia('(prefers-color-scheme:dark)').matches);
 const r=document.documentElement;r.dataset.t=dark?'dark':'light';
 r.style.setProperty('--accent',t.accent);r.style.setProperty('--bubble',t.bubble);
 r.style.setProperty('--wall',(WALLS[t.wall]||WALLS.none)[dark?1:0]);
 document.querySelector('meta[name=theme-color]').content=dark?'#000000':'#ffffff';
 try{localStorage.setItem('th',JSON.stringify(t))}catch(e){}return t}
try{theme(JSON.parse(localStorage.getItem('th')))}catch(e){theme()}
matchMedia('(prefers-color-scheme:dark)').addEventListener?.('change',()=>theme(prof?.theme));

function av(p,s=40,cls=''){if(!p)return`<div class="av ${cls}" style="width:${s}px;height:${s}px;background:#9ca3af"></div>`;
 return p.avatar_url?`<img class="av ${cls}" style="width:${s}px;height:${s}px" src="${esc(p.avatar_url)}" alt="">`
 :`<div class="av ${cls}" style="width:${s}px;height:${s}px;background:${grad(p.color)};font-size:${s*.42}px">${esc((p.name||'?').trim()[0]||'?').toUpperCase()}</div>`}
const hm=d=>new Date(d).toLocaleTimeString('ru',{hour:'2-digit',minute:'2-digit'});

/* ---------- Авторизация ---------- */
function authUI(){const up=authMode==='up';$('#go').textContent=up?'Создать аккаунт':'Войти';$('#sw').textContent=up?'Уже есть аккаунт? Войти':'Создать аккаунт';
 $('#pw').autocomplete=up?'new-password':'current-password';$('#msg').textContent=''}
$('#sw').onclick=()=>{authMode=authMode==='in'?'up':'in';authUI()};
$('#go').onclick=async()=>{const email=$('#em').value.trim(),password=$('#pw').value;
 if(!email||password.length<6){$('#msg').textContent='Введите почту и пароль от 6 символов';return}
 $('#go').disabled=true;$('#msg').textContent='…';
 const r=authMode==='up'?await sb.auth.signUp({email,password}):await sb.auth.signInWithPassword({email,password});
 $('#go').disabled=false;
 if(r.error){$('#msg').textContent=r.error.message.includes('Invalid login')?'Неверная почта или пароль':r.error.message;return}
 if(!r.data.session){$('#msg').textContent='Подтвердите почту по письму, затем войдите';authMode='in';authUI();return}
 start(r.data.session)};
$('#pw').onkeydown=e=>{if(e.key==='Enter')$('#go').click()};

/* ---------- Старт ---------- */
let P={},chats=[],M={},cur=null;
const cm=()=>M[cur]||[];
const peer=c=>P[c.user1===me.id?c.user2:c.user1];
const tm=d=>new Date(d).toDateString()===new Date().toDateString()?hm(d):new Date(d).toLocaleDateString('ru',{day:'numeric',month:'short'});
function show(id){['load','auth','home','chat'].forEach(k=>$('#'+k).hidden=k!==id)}
async function start(s){if(me)return;me=s.user;show('load');
 const {data,error}=await sb.from('profiles').select('*').eq('id',me.id);
 if(error){$('#load').innerHTML='<div class="box"><p>Ошибка базы: '+esc(error.message)+'</p><p>Выполните setup.sql в Supabase</p></div>';return}
 prof=data[0];
 if(!prof){show('home');editor(true);return}
 enter()}
async function boot(){
 if(!window.CFG||CFG.url.startsWith('ВСТАВЬТЕ')){$('#load').innerHTML='<div class="box"><p>Откройте config.js и вставьте URL и ключ Supabase</p></div>';return}
 sb=supabase.createClient(CFG.url,CFG.key);
 sb.auth.onAuthStateChange((ev,s)=>{if(ev==='SIGNED_OUT')location.reload();if(ev==='SIGNED_IN'&&s&&!me)setTimeout(()=>start(s),0)});
 const {data}=await sb.auth.getSession();
 if(data.session)start(data.session);else{authUI();show('auth')}
 if(/iphone|ipad/i.test(navigator.userAgent)&&!navigator.standalone)$('#hint').textContent='Чтобы установить: «Поделиться» → «На экран Домой»'}

/* ---------- Список чатов ---------- */
async function enter(){theme(prof.theme);P[me.id]=prof;show('home');await loadAll();sets();loadContacts();
 sb.channel('room')
 .on('postgres_changes',{event:'*',schema:'public',table:'messages'},onMsg)
 .on('postgres_changes',{event:'INSERT',schema:'public',table:'chats'},()=>loadAll())
 .on('postgres_changes',{event:'*',schema:'public',table:'profiles'},p=>{const n=p.new;if(!n||!n.id)return;P[n.id]=n;if(n.id===me.id){prof=n;return}if(p.eventType==='INSERT'){CT.push(n);ulist()}cur?head():home()}).subscribe();
 const ping=()=>{if(!document.hidden)sb.from('profiles').update({last_seen:new Date().toISOString()}).eq('id',me.id)};
 ping();setInterval(ping,30000);setInterval(()=>{if(cur)head()},30000);
 document.addEventListener('visibilitychange',()=>{if(!document.hidden){ping();loadAll()}})}
async function loadAll(){const r=await sb.from('chats').select('*');chats=r.data||[];
 const ids=[...new Set(chats.map(c=>c.user1===me.id?c.user2:c.user1))];
 if(ids.length){const pr=await sb.from('profiles').select('*').in('id',ids);(pr.data||[]).forEach(p=>P[p.id]=p)}
 const m=await sb.from('messages').select('*').order('id',{ascending:false}).limit(500);
 M={};(m.data||[]).reverse().forEach(x=>(M[x.chat_id]=M[x.chat_id]||[]).push(x));
 if(cur){render();head();markRead()}else home()}
function onMsg(p){const n=p.new;
 if(p.eventType==='DELETE'){for(const k in M)M[k]=M[k].filter(m=>m.id!==p.old.id)}
 else{if(!chats.some(c=>c.id===n.chat_id)){loadAll();return}
  const a=M[n.chat_id]=M[n.chat_id]||[],i=a.findIndex(m=>m.id===n.id);if(i>-1)a[i]=n;else a.push(n)}
 if(cur){render(p.eventType==='INSERT'&&n.chat_id===cur);markRead()}else home()}
function home(){const f=$('#q').value.trim().toLowerCase();
 const rows=chats.map(c=>{const a=M[c.id]||[],l=a[a.length-1];return{c,p:peer(c),l,u:a.filter(m=>m.sender!==me.id&&!m.read).length,t:l?l.created_at:c.created_at}}).filter(r=>!f||((r.p?.name||'')+' '+(r.p?.username||'')).toLowerCase().includes(f)).sort((x,y)=>new Date(y.t)-new Date(x.t));
 $('#clist').innerHTML=rows.length?rows.map(r=>`<div class="crow" data-c="${r.c.id}">${av(r.p,60)}<div class="ci"><b>${esc(r.p?.name||'…')} ${esc(r.p?.status_emoji||'')}</b><small>${r.l?(r.l.sender===me.id?'Вы: ':'')+esc(r.l.body):'Нет сообщений'}</small></div><div class="cm">${r.l?tm(r.l.created_at):''}${r.u?`<br><span class="badge">${r.u}</span>`:''}</div></div>`).join('')
 :'<div class="empty">Чатов пока нет.<br>Откройте «Контакты», чтобы начать переписку.</div>'}
$('#q').oninput=home;
let CT=[];
async function loadContacts(){const {data}=await sb.from('profiles').select('*').neq('id',me.id).order('name').limit(300);CT=data||[];CT.forEach(p=>P[p.id]=p);ulist()}
function stat(p){return Date.now()-new Date(p.last_seen)<70000?'в сети':'был(а) '+tm(p.last_seen)}
function ulist(){const f=$('#q2').value.trim().toLowerCase().replace(/^@/,'');
 const r=CT.filter(p=>!f||((p.name||'')+' '+(p.username||'')).toLowerCase().includes(f));
 $('#ulist').innerHTML=r.length?r.map(p=>`<div class="crow" data-u="${p.id}">${av(p,52)}<div class="ci"><b>${esc(p.name)} ${esc(p.status_emoji)}</b><small>@${esc(p.username)}, ${stat(p)}</small></div></div>`).join(''):'<div class="empty">Пока никого нет. Люди появятся здесь после регистрации.</div>'}
$('#q2').oninput=ulist;
const rowClick=e=>{const r=e.target.closest('.crow');if(!r)return;if(r.dataset.c)openChat(+r.dataset.c);else startWith(r.dataset.u)};
$('#clist').onclick=$('#ulist').onclick=rowClick;
function tab(n){['Chats','Cont','Set'].forEach(k=>$('#p'+k).hidden=k!==n);document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===n));if(n==='Cont')ulist()}
$('#tabs').onclick=e=>{const b=e.target.closest('button');if(b)tab(b.dataset.t)};
$('#newc').onclick=()=>tab('Cont');
function sets(){const md={auto:'Авто',light:'Светлая',dark:'Тёмная'}[(prof.theme||{}).mode||'auto'];
 $('#sprof').innerHTML=`<div style="margin:calc(10px + env(safe-area-inset-top)) 16px 0">${hdr(prof,'в сети')}</div>`;
 $('#sbody').innerHTML=`<div class="grp"><div class="srow" data-s="ed"><i class="ic" style="background:#ef5b4f">👤</i><span>Мой профиль</span><em>›</em></div></div>
 <div class="grp"><div class="srow" data-s="ed"><i class="ic" style="background:#3e88f7">🎨</i><span>Оформление</span><em>›</em></div>
 <div class="srow" data-s="mode"><i class="ic" style="background:#8e5cf0">🌓</i><span>Тема</span><b class="val">${md}</b><em>›</em></div></div>
 <div class="grp"><div class="srow red" data-s="out"><i class="ic" style="background:#8e8e93">↩</i><span>Выйти из аккаунта</span></div></div>`}
$('#sbody').onclick=e=>{const r=e.target.closest('[data-s]');if(!r)return;const k=r.dataset.s;
 if(k==='ed')editor(false);if(k==='mode')cycleMode();if(k==='out'&&confirm('Выйти из аккаунта?'))sb.auth.signOut()};
async function cycleMode(){const o=['auto','light','dark'],t={...(prof.theme||{})};t.mode=o[(o.indexOf(t.mode||'auto')+1)%3];
 theme(t);prof.theme=t;P[me.id]=prof;sets();await sb.from('profiles').update({theme:t}).eq('id',me.id)}
async function startWith(uid){let c=chats.find(c=>c.user1===uid||c.user2===uid);
 if(!c){const {data,error}=await sb.from('chats').insert({user1:me.id,user2:uid}).select().single();if(error){toast(error.message);return}c=data;if(!chats.some(x=>x.id===c.id))chats.push(c)}
 $('#q').value='';openChat(c.id)}

/* ---------- Чат ---------- */
function openChat(id){cur=id;unbar();$('#inp').value='';fit();show('chat');head();render(true);markRead()}
$('#back').onclick=()=>{cur=null;unbar();show('home');home()};
function head(){const c=chats.find(x=>x.id===cur);if(!c)return;const o=peer(c);$('#hav').innerHTML=av(o,42);
 let st='';if(o){st=Date.now()-new Date(o.last_seen)<70000?'в сети':'был(а) '+(new Date(o.last_seen).toDateString()===new Date().toDateString()?'в '+hm(o.last_seen):new Date(o.last_seen).toLocaleDateString('ru',{day:'numeric',month:'short'}))}
 $('#who').innerHTML=`<b>${o?esc(o.name)+' '+esc(o.status_emoji):'Чат'}</b><small>${st}</small>`}
$('#hav').onclick=$('#who').onclick=()=>{const c=chats.find(x=>x.id===cur);if(c&&peer(c))card(peer(c))};
function render(sc){const msgs=cm(),box=$('#list');const near=box.scrollHeight-box.scrollTop-box.clientHeight<140;
 let last='',h='';
 if(!msgs.length)h='<div class="day">Напишите первое сообщение</div>';
 for(const m of msgs){const day=new Date(m.created_at).toLocaleDateString('ru',{day:'numeric',month:'long'});
  if(day!==last){h+=`<div class="day">${day}</div>`;last=day}
  const sn=shown[cur]||(shown[cur]=new Set(msgs.map(x=>x.id)));const isNew=!sn.has(m.id);sn.add(m.id);
  const mine=m.sender===me.id,rp=m.reply_to&&msgs.find(x=>x.id===m.reply_to);
  const g={};Object.values(m.reactions||{}).forEach(e=>g[e]=(g[e]||0)+1);
  const chips=Object.keys(g).map(e=>`<span class="chip ${(m.reactions||{})[me.id]===e?'on':''}" data-id="${m.id}" data-e="${e}">${e}${g[e]>1?' '+g[e]:''}</span>`).join('');
  h+=`<div class="row ${mine?'me':''}${isNew?' in':''}"><div class="b" data-id="${m.id}">${rp?`<div class="rp">${esc(rp.body)}</div>`:''}${m.kind==='image'?`<img class="mi" src="${esc(m.media_url)}" alt="">`:m.kind==='voice'?`<audio controls preload="none" src="${esc(m.media_url)}"></audio>`:esc(m.body)}<i class="t">${m.edited?'изм. ':''}${hm(m.created_at)}${mine?(m.read?' ✓✓':' ✓'):''}</i>${chips?`<div class="chips">${chips}</div>`:''}</div></div>`}
 box.innerHTML=h;if(sc||near)box.scrollTop=box.scrollHeight}
$('#list').onclick=e=>{if(e.target.closest('audio'))return;
 if(e.target.matches('img.mi')){const V=$('#viewer');V.innerHTML=`<img src="${esc(e.target.src)}" alt="">`;V.hidden=false;V.onclick=()=>V.hidden=true;return}
 const c=e.target.closest('.chip');if(c){react(cm().find(m=>m.id==c.dataset.id),c.dataset.e);return}
 const b=e.target.closest('.b');if(b)menu(+b.dataset.id)};
let mrT;function markRead(){clearTimeout(mrT);mrT=setTimeout(async()=>{if(document.hidden||!cur)return;
 const ids=cm().filter(m=>m.sender!==me.id&&!m.read).map(m=>m.id);if(!ids.length)return;
 cm().forEach(m=>{if(ids.includes(m.id))m.read=true});await sb.from('messages').update({read:true}).in('id',ids)},400)}
async function react(m,e){if(!m)return;const r={...(m.reactions||{})};if(r[me.id]===e)delete r[me.id];else r[me.id]=e;
 m.reactions=r;render();await sb.from('messages').update({reactions:r}).eq('id',m.id)}
function menu(id){const m=cm().find(x=>x.id===id);if(!m)return;const mine=m.sender===me.id,Mn=$('#menu'),tx=!m.kind||m.kind==='text';
 Mn.innerHTML=`<div class="sh"><div class="rxs">${EM.map(e=>`<b data-r="${e}">${e}</b>`).join('')}</div>
 <button class="a" data-a="reply">Ответить</button>${tx?'<button class="a" data-a="copy">Копировать</button>':''}
 ${mine&&tx?'<button class="a" data-a="edit">Изменить</button>':''}${mine?'<button class="a red" data-a="del">Удалить</button>':''}</div>`;
 Mn.hidden=false;
 Mn.onclick=async e=>{const r=e.target.closest('[data-r]'),a=e.target.closest('[data-a]');
  if(!r&&!a){if(e.target===Mn)Mn.hidden=true;return}Mn.hidden=true;
  if(r)return react(m,r.dataset.r);
  const k=a.dataset.a;
  if(k==='reply')bar('reply',m);
  if(k==='edit'){bar('edit',m);$('#inp').value=m.body;fit()}
  if(k==='copy'){try{await navigator.clipboard.writeText(m.body);toast('Скопировано')}catch(e){}}
  if(k==='del'&&confirm('Удалить сообщение?')){M[cur]=cm().filter(x=>x.id!==m.id);render();await sb.from('messages').delete().eq('id',m.id)}}}
function bar(kind,m){reply=kind==='reply'?m:null;editing=kind==='edit'?m:null;
 $('#bar').hidden=false;$('#bt').textContent=(kind==='reply'?'Ответ: ':'Изменить: ')+m.body;$('#inp').focus()}
function unbar(){reply=editing=null;$('#bar').hidden=true}
$('#bx').onclick=()=>{unbar();$('#inp').value='';fit()};
const inp=$('#inp');function fit(){inp.style.height='44px';inp.style.height=Math.min(inp.scrollHeight+2,120)+'px'}
inp.oninput=fit;
async function send(){const t=inp.value.trim();if(!t||!cur)return;inp.value='';const id=cur;
 if(editing){const m=editing;unbar();fit();m.body=t;m.edited=true;render();await sb.from('messages').update({body:t,edited:true}).eq('id',m.id);return}
 const row={chat_id:id,body:t};if(reply)row.reply_to=reply.id;unbar();fit();
 const {data,error}=await sb.from('messages').insert(row).select().single();
 if(error){toast('Не отправлено: '+error.message);inp.value=t;fit();return}
 const a=M[id]=M[id]||[];if(!a.some(m=>m.id===data.id)){a.push(data);if(cur===id)render(true)}}
$('#sendb').onclick=send;
function scale(f,n=1280){return new Promise(r=>{const i=new Image();i.onload=()=>{const k=Math.min(1,n/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;
 c.getContext('2d').drawImage(i,0,0,c.width,c.height);c.toBlob(r,'image/jpeg',.82)};i.src=URL.createObjectURL(f)})}
async function sendMedia(blob,kind,ext,type){const id=cur;if(!id)return;toast('Отправка…');
 const path=`${me.id}/${Date.now()}.${ext}`;const up=await sb.storage.from('media').upload(path,blob,{contentType:type});
 if(up.error){toast('Не загрузилось: '+up.error.message);return}
 const row={chat_id:id,kind,media_url:sb.storage.from('media').getPublicUrl(path).data.publicUrl,body:kind==='image'?'📷 Фото':'🎤 Голосовое'};
 if(reply)row.reply_to=reply.id;unbar();
 const {data,error}=await sb.from('messages').insert(row).select().single();
 if(error){toast('Не отправлено: '+error.message);return}
 const a=M[id]=M[id]||[];if(!a.some(m=>m.id===data.id)){a.push(data);if(cur===id)render(true)}}
$('#att').onclick=()=>$('#fileIn').click();
$('#fileIn').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;sendMedia(await scale(f),'image','jpg','image/jpeg')};
let rec=null,chunks=[],rt,t0;
$('#mic').onclick=async()=>{if(rec){rec.stop();return}
 try{const st=await navigator.mediaDevices.getUserMedia({audio:true});
  const mt=['audio/mp4','audio/webm;codecs=opus','audio/webm'].find(t=>MediaRecorder.isTypeSupported(t))||'';
  rec=new MediaRecorder(st,mt?{mimeType:mt}:{});chunks=[];t0=Date.now();
  rec.ondataavailable=e=>chunks.push(e.data);
  rec.onstop=()=>{st.getTracks().forEach(t=>t.stop());clearInterval(rt);const b=$('#mic');b.classList.remove('rec');b.textContent='🎤';
   const type=(rec.mimeType||mt||'audio/mp4').split(';')[0],dur=Date.now()-t0;rec=null;
   if(dur<1000)return;sendMedia(new Blob(chunks,{type}),'voice',type.includes('webm')?'webm':'m4a',type)};
  rec.start();const b=$('#mic');b.classList.add('rec');b.textContent='⏹ 0';
  rt=setInterval(()=>{b.textContent='⏹ '+Math.round((Date.now()-t0)/1000)},500)
 }catch(err){rec=null;toast('Нет доступа к микрофону')}};

/* ---------- Карточка собеседника ---------- */
function hdr(p,st){const [a,b]=pc(p.color),e=(p.theme||{}).bge||'';
 const pe=p.avatar_url?p:{...p,color:'#8fd3f2,#4a8de0'};
 return `<div class="ph" style="background:radial-gradient(circle at 50% 38%,rgba(255,255,255,.25),transparent 62%),linear-gradient(160deg,${a},${b})">${e?POS.map(([x,y])=>`<span class="e" style="left:${x}%;top:${y}%">${e}</span>`).join(''):''}${av(pe,92)}<div class="nm">${esc(p.name||'Имя')} ${esc(p.status_emoji||'')}</div><small>${st??stat(p)}</small></div>`}
function card(p){const S=$('#sheet');
 S.innerHTML=`<div class="sh">${hdr(p)}<div class="grp" style="margin:0"><div class="srow" style="display:block"><small class="mut">имя пользователя</small><div style="color:var(--accent);font-size:18px">@${esc(p.username)}</div></div>${p.bio?`<div class="srow" style="display:block"><small class="mut">о себе</small><div style="white-space:pre-wrap">${esc(p.bio)}</div></div>`:''}</div></div>`;
 S.hidden=false;S.onclick=e=>{if(e.target===S)S.hidden=true}}

/* ---------- Редактор профиля и оформления ---------- */
function shrink(f,n=320){return new Promise(r=>{const i=new Image();i.onload=()=>{const s=Math.min(i.width,i.height),c=document.createElement('canvas');c.width=c.height=n;
 c.getContext('2d').drawImage(i,(i.width-s)/2,(i.height-s)/2,s,s,0,0,n,n);c.toBlob(r,'image/jpeg',.85)};i.src=URL.createObjectURL(f)})}
function editor(first){const S=$('#sheet');pend=null;let pendUrl='';
 const p=prof||{name:'',username:'',bio:'',status_emoji:'',color:'#4a7ec2',avatar_url:'',theme:{}};
 let t={mode:'auto',accent:'#3e88f7',bubble:'#3e88f7',wall:'none',bge:'',...p.theme};let col=p.color||'#4a7ec2';
 if(!WALLS[t.wall])t.wall='none';
 const dk=document.documentElement.dataset.t==='dark'?1:0;
 S.innerHTML=`<div class="sh"><h2>${first?'Создайте профиль':'Оформление'}</h2>
 <div id="pvh"></div>
 <label class="btn sec" style="display:block;text-align:center;color:var(--accent)">Выбрать фото<input id="file" type="file" accept="image/*" hidden></label>
 <div class="grp" style="margin:0"><div class="pal" id="pal">${PAL.map((c,i)=>`<i data-i="${i}" style="background:linear-gradient(135deg,${c[0]},${c[1]||c[0]})"></i>`).join('')}</div>
 <div class="srow" id="bgrow"><span>Фоновый эмодзи</span><b class="val" id="bgv"></b><em>›</em></div></div>
 <div id="bgpick" class="emg" hidden>${BGE.map(e=>`<b data-e="${e}">${e||'нет'}</b>`).join('')}</div>
 <button class="a" id="rst" style="color:var(--accent);text-align:center">Сбросить цвет профиля</button>
 <label>Имя<input id="f_name" maxlength="30" value="${esc(p.name)}"></label>
 <label>Юзернейм (по нему вас найдут)<input id="f_user" maxlength="24" autocapitalize="off" value="${esc(p.username||'')}" placeholder="например anna_2024"></label>
 <label>О себе<textarea id="f_bio" rows="2" maxlength="160">${esc(p.bio)}</textarea></label>
 <label>Эмодзи-статус<input id="f_emo" maxlength="8" value="${esc(p.status_emoji)}" placeholder="😎"></label>
 <div class="two" style="grid-template-columns:1fr 1fr"><label>Акцент<input id="f_acc" type="color" value="${esc(t.accent)}"></label>
 <label>Мои сообщения<input id="f_bub" type="color" value="${esc(t.bubble)}"></label></div>
 <label>Тема</label><div class="seg" id="f_mode">${[['auto','Авто'],['light','Светлая'],['dark','Тёмная']].map(([k,n])=>`<button data-m="${k}" class="${t.mode===k?'on':''}">${n}</button>`).join('')}</div>
 <label>Обои чата</label><div class="walls" id="f_wall">${Object.keys(WALLS).map(k=>`<i data-w="${k}" class="${t.wall===k?'on':''}" style="background:${k==='none'?'var(--card)':WALLS[k][dk]}"></i>`).join('')}</div>
 ${first?'':'<button class="a" id="f_close" style="text-align:center">Закрыть без сохранения</button>'}
 <p id="f_err" style="color:#ff453a;margin:0"></p>
 <button class="btn" id="f_save" style="position:sticky;bottom:0">Применить стиль</button></div>`;
 S.hidden=false;S.onclick=null;
 const same=c=>pc(col).join()===(c[1]?c:[c[0],c[0]]).join();
 const pv=()=>{$('#pvh').innerHTML=hdr({...p,name:$('#f_name').value.trim(),status_emoji:$('#f_emo').value.trim(),color:col,theme:{...t},avatar_url:pendUrl||p.avatar_url},'в сети');
  [...$('#pal').children].forEach((x,i)=>x.classList.toggle('on',same(PAL[i])));$('#bgv').textContent=t.bge||'нет'};
 pv();
 $('#pal').onclick=e=>{const b=e.target.closest('i');if(!b)return;col=PAL[+b.dataset.i].join(',');pv()};
 $('#bgrow').onclick=()=>$('#bgpick').hidden=!$('#bgpick').hidden;
 $('#bgpick').onclick=e=>{const b=e.target.closest('b');if(!b)return;t.bge=b.dataset.e;$('#bgpick').hidden=true;pv()};
 $('#rst').onclick=()=>{col='#4a7ec2';t.bge='';pv()};
 $('#f_name').oninput=$('#f_emo').oninput=pv;
 const live=()=>{t={...t,accent:$('#f_acc').value,bubble:$('#f_bub').value};theme(t)};
 $('#f_acc').oninput=$('#f_bub').oninput=live;
 $('#f_mode').onclick=e=>{const b=e.target.closest('button');if(!b)return;t.mode=b.dataset.m;[...$('#f_mode').children].forEach(x=>x.classList.toggle('on',x===b));live()};
 $('#f_wall').onclick=e=>{const b=e.target.closest('i');if(!b)return;t.wall=b.dataset.w;[...$('#f_wall').children].forEach(x=>x.classList.toggle('on',x===b));live()};
 $('#file').onchange=async e=>{const f=e.target.files[0];if(!f)return;pend=await shrink(f);pendUrl=URL.createObjectURL(pend);pv()};
 if(!first)$('#f_close').onclick=()=>{S.hidden=true;theme(prof.theme)};
 $('#f_save').onclick=async()=>{const err=$('#f_err');err.textContent='';
  const name=$('#f_name').value.trim();if(!name){err.textContent='Введите имя';return}
  const username=$('#f_user').value.trim().toLowerCase().replace(/^@/,'');
  if(!/^[a-z0-9_]{3,24}$/.test(username)){err.textContent='Юзернейм: 3–24 символа, латиница, цифры и _';return}
  $('#f_save').disabled=true;let url=p.avatar_url||'';
  if(pend){const path=`${me.id}/${Date.now()}.jpg`;const up=await sb.storage.from('avatars').upload(path,pend,{contentType:'image/jpeg'});
   if(up.error){err.textContent='Фото не загрузилось: '+up.error.message;$('#f_save').disabled=false;return}
   url=sb.storage.from('avatars').getPublicUrl(path).data.publicUrl}
  const v={name,username,bio:$('#f_bio').value.trim(),status_emoji:$('#f_emo').value.trim(),color:col,avatar_url:url,theme:t};
  const q=prof?sb.from('profiles').update(v).eq('id',me.id):sb.from('profiles').insert({id:me.id,...v});
  const {data,error}=await q.select().single();$('#f_save').disabled=false;
  if(error){err.textContent=error.code==='23505'?'Этот юзернейм занят':error.message;return}
  const was=!!prof;prof=data;P[me.id]=data;S.hidden=true;theme(prof.theme);
  if(!was)enter();else{toast('Сохранено');sets();if(cur)render();else home()}}}

if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
boot();
</script>
</body>
