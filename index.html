<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Чат</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="theme-color" content="#090a0c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Чат">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
<section id="load" class="full center"><div class="box"><div class="spin"></div></div></section>

<section id="auth" class="full center" hidden><div class="box">
 <div class="logo"><svg width="46" height="46" viewBox="0 0 24 24" fill="#fff"><path d="M4 4h16a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H9l-5 4v-4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"/></svg></div>
 <h1>Чат</h1>
 <input id="em" type="email" placeholder="Почта" autocomplete="email" autocapitalize="off">
 <input id="pw" type="password" placeholder="Пароль (от 6 символов)" autocomplete="current-password">
 <button id="go" class="btn">Войти</button>
 <div id="msg" class="msg"></div>
 <button id="swm" class="link">Создать аккаунт</button>
 <p id="hint"></p>
</div></section>

<section id="keys" class="full center" hidden><div class="box">
 <div class="logo"><svg width="42" height="42" viewBox="0 0 24 24" fill="#fff"><path d="M12 2a5 5 0 0 0-5 5v3H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8a2 2 0 0 0-2-2h-1V7a5 5 0 0 0-5-5zm-3 8V7a3 3 0 0 1 6 0v3z"/></svg></div>
 <h1 id="kt">Ключ шифрования</h1>
 <p id="kd"></p>
 <input id="kp" type="password" placeholder="Ключевая фраза" autocomplete="off">
 <input id="kp2" type="password" placeholder="Повторите фразу" autocomplete="off" hidden>
 <button id="kgo" class="btn">Продолжить</button>
 <div id="kmsg" class="msg"></div>
</div></section>

<section id="home" class="full" hidden>
 <div class="top"><h2>Чаты</h2><button id="newb" class="ib" aria-label="Новый чат"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button><button id="gear" class="ib" aria-label="Настройки"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 13a7.5 7.5 0 0 0 0-2l2-1.5-2-3.5-2.3 1a7.5 7.5 0 0 0-1.7-1L15 3.5h-4l-.4 2.5a7.5 7.5 0 0 0-1.7 1l-2.3-1-2 3.5 2 1.5a7.5 7.5 0 0 0 0 2l-2 1.5 2 3.5 2.3-1a7.5 7.5 0 0 0 1.7 1l.4 2.5h4l.4-2.5a7.5 7.5 0 0 0 1.7-1l2.3 1 2-3.5z" opacity=".9"/></svg></button></div>
 <div class="sbox"><input id="q" placeholder="Поиск"></div>
 <div id="chips"></div>
 <div id="clist"></div>
 <nav id="nav"><button data-tab="chats" class="on"><svg viewBox="0 0 24 24"><path d="M4 5h16a1 1 0 011 1v10a1 1 0 01-1 1H9l-5 4V6a1 1 0 011-1z"/></svg><span>Чаты</span></button><button data-tab="contacts"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.6-3.6 3.2-5.5 6.5-5.5s5.9 1.900 6.500 5.500"/><path d="M16 4.800a3.400 3.400 0 010 6.400M18.500 14.800c1.800.8 2.800 2.600 3.100 5"/></svg><span>Контакты</span></button><button data-tab="profile"><svg viewBox="0 0 24 24"><circle cx="12" cy="8.500" r="4"/><path d="M4 21c.7-4.400 4-6.500 8-6.500s7.300 2.100 8 6.500"/></svg><span>Профиль</span></button><button data-tab="settings"><svg viewBox="0 0 24 24"><path d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8Z"/><path d="m19.4 15 .1.1 1.2 1-1.5 2.6-1.5-.6a7.8 7.8 0 0 1-1.4.8l-.2 1.6h-3l-.3-1.6a7.8 7.8 0 0 1-1.4-.8l-1.5.6-1.5-2.6 1.2-1a7.4 7.4 0 0 1 0-1.6l-1.2-1 1.5-2.6 1.5.6a7.8 7.8 0 0 1 1.4-.8l.3-1.6h3l.2 1.6a7.8 7.8 0 0 1 1.4.8l1.5-.6 1.5 2.6-1.2 1a7.4 7.4 0 0 1 0 1.6Z"/></svg><span>Настройки</span></button></nav>
</section>

<section id="chat" class="full" hidden>
 <div class="top" id="chead"><button id="back" class="ib" aria-label="Назад"><svg width="22" height="22" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button><div id="hav"></div><div id="who"></div><button id="cvoice" class="ib" aria-label="Голосовой звонок"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h4l2 5-2.500 1.500a11 11 0 005 5L15 13l5 2v4a2 2 0 01-2 2A16 16 0 013 6a2 2 0 012-2z"/></svg></button><button id="cvideo" class="ib" aria-label="Видеозвонок"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2.500" y="6" width="13" height="12" rx="3"/><path d="M15.500 10.500l6-3.500v10l-6-3.500z"/></svg></button></div>
 <div id="selbar" class="top" hidden><button id="sx" class="ib" aria-label="Отмена">✕</button><b id="sn" style="flex:1;font-size:18px"></b><button id="sc" class="ib" aria-label="Копировать"></button><button id="sf" class="ib" aria-label="Переслать"></button><button id="sd" class="ib" aria-label="Удалить" style="color:var(--danger)"></button></div>
 <div id="pin" hidden><i></i><div><b>Закреплённое сообщение</b><small id="pt"></small></div></div>
 <div id="list"></div>
 <div id="cw">
  <div id="bar" hidden><span id="bt"></span><button id="bx" aria-label="Отмена">✕</button></div>
  <div id="recbar" hidden><i></i><b id="rect">0:00</b><span>Идёт запись…</span><button id="recx">Отмена</button></div>
  <div id="comp">
   <button id="att" class="ib" aria-label="Прикрепить"><svg width="22" height="22" viewBox="0 0 24 24"><path d="M20 11.5l-8 8a5 5 0 0 1-7-7l9-9a3.3 3.3 0 0 1 4.7 4.7l-9 9a1.7 1.7 0 0 1-2.4-2.4l8-8" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg></button>
   <input id="fileIn" type="file" hidden>
   <textarea id="inp" rows="1" placeholder="Сообщение"></textarea>
   <button id="mic" class="ib" aria-label="Голосовое"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.9V22h2v-3.1A7 7 0 0 0 19 12z"/></svg></button>
   <button id="sendb" class="ib" aria-label="Отправить" hidden><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M3 20l18-8L3 4v6l11 2-11 2z"/></svg></button>
  </div>
  <div id="ro" class="ro" hidden>Писать в этот канал могут только администраторы</div>
 </div>
</section>
</div>
<div id="ctx" hidden></div>
<div id="sheet" class="over" hidden></div>
<div id="viewer" class="over" hidden></div>
<div id="sv" hidden></div>
<div id="call" hidden></div>
<div id="toast" hidden></div>

<script>/* мгновенная оболочка: показываем интерфейс до загрузки скриптов */
(function(){try{var has=false;for(var i=0;i<localStorage.length;i++){if(/^sb-.+-auth-token$/.test(localStorage.key(i))){has=true;break}}
var th={};try{th=JSON.parse(localStorage.getItem('th')||'{}')||{}}catch(e){}var m=th.mode||'auto',d=m==='dark'||(m!=='light'&&matchMedia('(prefers-color-scheme: dark)').matches);document.documentElement.dataset.t=d?'dark':'light';
document.getElementById('load').hidden=true;
if(has){window.__shell=1;document.getElementById('home').hidden=false;var h='';for(var j=0;j<8;j++)h+='<div class="crow sk"><div class="av"></div><div class="ci"><b style="width:'+(40+(j*13)%35)+'%"></b><small style="width:'+(55+(j*17)%35)+'%"></small></div></div>';document.getElementById('clist').innerHTML=h}
else{document.getElementById('auth').hidden=false}}catch(e){document.getElementById('load').hidden=false}})();</script>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="app.js"></script>
</body>
</html>
