name: Build Message APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'
      - 'index.html'
      - 'app.js'
      - 'styles.css'
      - 'config.js'
      - 'manifest.webmanifest'
      - 'ios.css'
      - 'ios.js'
      - 'sw.js'
      - 'icon.svg'
      - 'icon-192.png'
      - 'icon-512.png'
      - '.well-known/assetlinks.json'

concurrency:
  group: message-android-apk-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore stable Android debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: message-debug-signing-key-v1

      - name: Create stable debug signing key if missing
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v -keystore ~/.android/debug.keystore -storepass message-debug -alias message -keypass message-debug -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Message Debug,O=Message,C=LV"
          fi

      - name: Set unique Android version
        shell: bash
        run: |
          VERSION_CODE=$((100000 + GITHUB_RUN_NUMBER))
          VERSION="1.4.${GITHUB_RUN_NUMBER}"
          sed -i -E "s/versionCode [0-9]+/versionCode ${VERSION_CODE}/; s/versionName '[^']+'/versionName '${VERSION}'/" android/app/build.gradle
          sed -i -E "s/appVersion=[0-9.]+/appVersion=${VERSION}/" android/app/src/main/AndroidManifest.xml
          grep -q "versionCode ${VERSION_CODE}" android/app/build.gradle
          grep -q "versionName '${VERSION}'" android/app/build.gradle
          grep -q "appVersion=${VERSION}" android/app/src/main/AndroidManifest.xml

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: android
        run: gradle --no-daemon assembleDebug

      - name: Verify new APK signing certificate
        id: apkcert
        run: |
          set -e
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          APK_HEX=$("$APKSIGNER" verify --print-certs "$APK" | sed -n 's/.*certificate SHA-256 digest: //p' | head -n 1 | tr -d ':' | tr '[:lower:]' '[:upper:]')
          KEY_HEX=$(keytool -list -v -keystore ~/.android/debug.keystore -storepass message-debug -alias message | sed -n 's/.*SHA256: //p' | head -n 1 | tr -d ':' | tr '[:lower:]' '[:upper:]')
          test -n "$APK_HEX" && test "$APK_HEX" = "$KEY_HEX"
          APK_SHA=$(echo "$APK_HEX" | sed 's/../&:/g;s/:$//')
          echo "sha256=$APK_SHA" >> "$GITHUB_OUTPUT"

      - name: Validate Android TWA association
        env:
          APK_SHA256: ${{ steps.apkcert.outputs.sha256 }}
        run: |
          python3 - <<'PY'
          import json, os, re, xml.etree.ElementTree as ET
          from pathlib import Path

          gradle = Path('android/app/build.gradle').read_text(encoding='utf-8')
          match = re.search(r"applicationId\s+['\"]([^'\"]+)['\"]", gradle)
          if not match:
              raise SystemExit('applicationId is missing from android/app/build.gradle')
          package_name = match.group(1)

          manifest = ET.parse('android/app/src/main/AndroidManifest.xml').getroot()
          android = '{http://schemas.android.com/apk/res/android}'
          launcher = manifest.find('.//activity')
          if launcher is None:
              raise SystemExit('TWA LauncherActivity is missing from AndroidManifest.xml')
          if manifest.find('application/meta-data[@' + android + 'name="asset_statements"]') is None:
              raise SystemExit('asset_statements metadata is missing from AndroidManifest.xml')

          links = json.loads(Path('.well-known/assetlinks.json').read_text(encoding='utf-8'))
          entries = [x for x in links if x.get('target', {}).get('namespace') == 'android_app'
                     and x.get('target', {}).get('package_name') == package_name]
          if not entries:
              raise SystemExit(f'assetlinks.json has no Android entry for {package_name}')
          expected = os.environ['APK_SHA256'].replace(':', '').upper()
          fingerprints = {str(v).replace(':', '').upper()
                          for entry in entries for v in entry.get('target', {}).get('sha256_cert_fingerprints', [])}
          if expected not in fingerprints:
              raise SystemExit('APK signing certificate does not match .well-known/assetlinks.json')
          print(f'TWA association verified for {package_name}')
          PY

      - name: Publish APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Message-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish versioned Android release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v1.4.${{ github.run_number }}
          name: Loom Android 1.4.${{ github.run_number }}
          body: |
            Loom Android 1.4.${{ github.run_number }} — Chrome Trusted Web Activity.
            Signing certificate SHA-256 (hex, no colons): ${{ steps.apkcert.outputs.sha256 }}
          files: android/app/build/outputs/apk/debug/app-debug.apk
          make_latest: false
