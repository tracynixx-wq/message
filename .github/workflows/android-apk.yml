name: Build Message APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'
      - 'index.html'
      - 'app.js'
      - 'styles.css'
      - 'config.js'
      - 'manifest.webmanifest'

concurrency:
  group: message-android-apk-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore stable Android debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: message-debug-signing-key-v1

      - name: Create stable debug signing key if missing
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v -keystore ~/.android/debug.keystore -storepass message-debug -alias message -keypass message-debug -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Message Debug,O=Message,C=LV"
          fi

      - name: Read Android signing certificate
        id: cert
        run: |
          SHA256=$(keytool -list -v -keystore ~/.android/debug.keystore -storepass message-debug -alias message | sed -n 's/.*SHA256: //p' | head -n 1)
          test -n "$SHA256"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: android
        run: gradle --no-daemon assembleDebug

      - name: Publish APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Message-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish versioned Android release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v1.3.0
          name: Message Android 1.3.0
          body: |
            Message Android 1.3.0 — Chrome Trusted Web Activity.
            Signing certificate SHA-256: ${{ steps.cert.outputs.sha256 }}
          files: android/app/build/outputs/apk/debug/app-debug.apk
          make_latest: true
