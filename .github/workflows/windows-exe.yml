name: Build Windows EXE

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Set embedded desktop build number
        shell: pwsh
        run: |
          $path = "electron/main.cjs"
          $source = Get-Content -Raw $path
          $replacement = "const DESKTOP_BUILD = ${{ github.run_number }};"
          $source = [regex]::Replace($source, 'const DESKTOP_BUILD = \d+;', $replacement)
          if (-not $source.Contains($replacement)) {
            throw "Could not stamp DESKTOP_BUILD in electron/main.cjs"
          }
          Set-Content -Path $path -Value $source -NoNewline -Encoding utf8
      - name: Build Windows installer and portable EXE
        run: npx electron-builder --win nsis portable --x64 --publish never
      - name: Upload EXE files
        uses: actions/upload-artifact@v4
        with:
          name: Message-Windows-EXE
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 30

