name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'electron/**'
      - '.github/workflows/windows-exe.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Set embedded desktop build number
        shell: pwsh
        run: |
          (Get-Content electron/main.cjs -Raw) -replace 'const DESKTOP_BUILD = \\d+;', 'const DESKTOP_BUILD = ${{ github.run_number }};' | Set-Content electron/main.cjs
      - name: Build Windows installer and portable EXE
        run: npx electron-builder --win nsis portable --x64 --publish never
      - name: Upload EXE files
        uses: actions/upload-artifact@v4
        with:
          name: Message-Windows-EXE
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish Windows EXE release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-build-${{ github.run_number }}
          name: Message Desktop build ${{ github.run_number }}
          prerelease: true
          files: dist/*.exe
          fail_on_unmatched_files: true
